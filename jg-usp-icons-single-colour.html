<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JG USP Icons — Single Colour</title>

<!-- ============================================================
     JG USP ICONS — JG USP Icons — Single Colour
     All artwork in Sand 400 #EDE1CF. Glints and sparkles are left in
     the lighter Sand 100 #FAF4EA / Sand 200 #F7EDDF so they still read
     as highlights against the artwork — flatten those too if the
     variant needs to be strictly one value.

     Four animated icons. Copy the <style> block once, then the
     <svg> for whichever icons you need. Each svg is self-contained
     apart from the shared keyframes in that style block.

     All four run on one 3.2s beat. Nothing here depends on any
     external file, font or script.

     NOTE: the experience and unique icons carry <defs> with ids
     (jgRingClip, jgGemClip and friends). They are unique within
     this file, but inlining the same icon twice on one page will
     collide — suffix the ids per instance, or use <use>.
     ============================================================ -->

<style>
/* ---- USP icon micro-animations (inlined so the paths are addressable).
     All four share one 3.2s beat; the centre star and the glint run at 2x,
     and the five small stars divide the beat evenly at .64s apart. ---- */
.uspico [class]{transform-box:view-box;}
/* the heart travels above the 48x48 viewBox at the top of its jump, and SVG
   clips to the viewport by default. The disc has 26px of padding around the
   icon, so there is room to let it draw outside. */
.uspico{overflow:visible;}

/* handmade — the beat holds for the first 10% while the hand starts to lift,
   then fires two rapid contractions: beat 1 at the top of the lift, beat 2
   just into the descent. Hand and heart then settle into a long rest.
   Per-keyframe easing gives the contractions their snap, so the animation
   itself runs linear and lets those curves through. */
@keyframes heartBeat{
  0%   {transform:scale(1);}
  10%  {transform:scale(1);    animation-timing-function:cubic-bezier(.25,0,.35,1);}  /* 10% delay */
  17%  {transform:scale(1.20); animation-timing-function:cubic-bezier(.45,0,.55,1);}  /* beat 1 */
  23%  {transform:scale(1.02); animation-timing-function:cubic-bezier(.25,0,.35,1);}
  29%  {transform:scale(1.16); animation-timing-function:cubic-bezier(.35,0,.3,1);}   /* beat 2 */
  38%  {transform:scale(1);}
  100% {transform:scale(1);}      /* rest */
}
.uspico .heart{transform-origin:31.8px 14.2px;animation:heartBeat 3.2s linear infinite;}

/* one flick, pivoting at the cuff so the fingers lift.
   The angle looks large written down: the pivot is only ~33px from the
   fingertips, so 8deg is about 4.6px of travel on a 48px icon. */
@keyframes handTilt{
  0%   {transform:rotate(0deg);}
  16%  {transform:rotate(-8deg);}
  45%  {transform:rotate(0deg);}
  100% {transform:rotate(0deg);}
}
.uspico .hand{transform-origin:9px 33px;animation:handTilt 3.2s ease-in-out infinite;}

/* straight up, no sideways drift — the arc's horizontal component is dropped
   deliberately. Per-keyframe easing makes it a jump rather than a glide: a
   quick launch, then an eased hang at the top before it drops back.
   On its own group so the lift and the beat's scale don't fight over one
   transform. */
@keyframes heartLift{
  0%   {transform:translateY(0);}
  6%   {transform:translateY(0);    animation-timing-function:cubic-bezier(.2,0,.35,1);}  /* waits for the hand, then launches */
  20%  {transform:translateY(-7px); animation-timing-function:cubic-bezier(.45,0,.55,1);} /* hang */
  45%  {transform:translateY(0);}
  100% {transform:translateY(0);}
}
.uspico .lift{animation:heartLift 3.2s linear infinite;}

/* unique — each ray extends from nothing to its full drawn length. The scale
   happens inside a rotated frame so it acts along the ray's own axis and the
   bar width is untouched, anchored at the inner end so it reaches outward. */
@keyframes rayGrowL{
  0%,100%{transform:rotate(41deg) scaleX(0) rotate(-41deg);}
  50%    {transform:rotate(41deg) scaleX(1) rotate(-41deg);}
}
@keyframes rayGrowR{
  0%,100%{transform:rotate(-41deg) scaleX(0) rotate(41deg);}
  50%    {transform:rotate(-41deg) scaleX(1) rotate(41deg);}
}
@keyframes rayGrowV{
  0%,100%{transform:scaleY(0);}
  50%    {transform:scaleY(1);}
}
.uspico .ray-l{transform-origin:13.16px 15.41px;animation:rayGrowL 3.2s ease-in-out infinite;}
.uspico .ray-r{transform-origin:34.95px 15.41px;animation:rayGrowR 3.2s ease-in-out infinite;}
.uspico .ray-v{transform-origin:24.1px 12.7px; animation:rayGrowV 3.2s ease-in-out infinite;}

/* unique — a glint travels across the stone. Clipping to the gem path means
   the light only lands on the outline and the facet lines, since the facet
   interiors are holes in that compound path — so it reads as light running
   through the stone's structure rather than a band crossing a solid shape. */
@keyframes gemGlint{
  0%      {transform:translateX(0) skewX(-18deg);}
  55%,100%{transform:translateX(60px) skewX(-18deg);}
}
.uspico .gemglint{animation:gemGlint 6.4s linear infinite;}

/* sparkles catching on individual facets, out of step with each other so the
   stone never flashes all at once */
@keyframes gemSparkle{
  0%,100%{transform:scale(0);opacity:0;}
  12%    {transform:scale(1);opacity:1;}
  32%    {transform:scale(0);opacity:0;}
}
/* backwards fill matters here: during a positive animation-delay an element
   renders its OWN style, not the 0% keyframe — so without this every delayed
   sparkle sits at full size until its turn arrives, and they all appear at once
   on first load. */
.uspico .gemspark,
.uspico .medalspark{transform-box:fill-box;transform-origin:50% 50%;
  animation:gemSparkle 3.2s ease-in-out infinite backwards;}
.uspico .gs2{animation-delay:.7s;}
.uspico .gs3{animation-delay:1.3s;}
.uspico .gs4{animation-delay:2s;}
.uspico .gs5{animation-delay:2.6s;}

/* the medal's own sparkles, sitting on the ring and offset from the two
   crimson stars beside the ribbon so nothing fires in pairs */
.uspico .ms1{animation-delay:.45s;}
.uspico .ms2{animation-delay:1.9s;}
.uspico .ms3{animation-delay:2.8s;}

/* unique — the stone floats gently */
@keyframes gemFloat{0%,100%{transform:translateY(1.4px);}50%{transform:translateY(-2px);}}
.uspico .gem{animation:gemFloat 3.2s ease-in-out infinite;}
.uspico .gem-float{animation:gemFloat 3.2s ease-in-out infinite;}

/* expertise — the small stars twinkle out of step with each other */
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.55);}45%{opacity:1;transform:scale(1.25);}}
.uspico .star{animation:twinkle 3.2s ease-in-out infinite backwards;}

/* expertise — the centre star pulses too, but far more gently */
@keyframes bigTwinkle{0%,100%{opacity:.72;transform:scale(.97);}50%{opacity:1;transform:scale(1.04);}}
.uspico .bigstar{transform-origin:24px 24.2px;animation:bigTwinkle 6.4s ease-in-out infinite;}
.uspico .s1{transform-origin:14.8px 11.8px;animation-delay:0s;}
.uspico .s2{transform-origin:8.8px 29px;   animation-delay:.64s;}
.uspico .s3{transform-origin:33.2px 11.8px;animation-delay:1.28s;}
.uspico .s4{transform-origin:24px 41.4px;  animation-delay:1.92s;}
.uspico .s5{transform-origin:38.8px 29px;  animation-delay:2.56s;}

/* the two stars flanking the ribbon reuse the Expertise twinkle. fill-box
   centres the scale on each star's own bounding box, so the shared keyframes
   work wherever the wrapping group puts them. Half a beat apart. */
.uspico .ribstar{transform-box:fill-box;transform-origin:50% 50%;}
.uspico .rs1{animation-delay:0s;}
.uspico .rs2{animation-delay:1.6s;}

/* experience — the star grows and settles on a long, slow breath, and a
   shimmer travels across it. The star and the shimmer sit in one group, so
   the shimmer scales with the star instead of drifting out of register. */
@keyframes starGrow{
  0%,100%{transform:scale(.92);}
  50%    {transform:scale(1.1);}
}
.uspico .medalstar{transform-origin:24px 19.8px;animation:starGrow 6.4s ease-in-out infinite;}

/* the band is clipped to the star, so it only lights the star's own shape */
@keyframes starShine{
  0%      {transform:translateX(0) skewX(-18deg);}
  60%,100%{transform:translateX(48px) skewX(-18deg);}
}
.uspico .starshine{animation:starShine 6.4s linear infinite;}

/* experience — a glint running the ring's circumference, continuously.
   Two dashes on the ring's centreline (r 12.9, circumference 81.05): a wide,
   heavily blurred halo at half opacity, and a short bright core inside it.
   That pairing is what reads as a specular glint rather than a lit segment.
   The core starts 4.5 further along so it sits centred in the halo, and both
   run linear at the same rate so they travel locked together. Blur is applied
   before the ring clip, so the light is soft along the arc but still trimmed
   to the 1.18 band. */
@keyframes glintHalo{
  from{stroke-dashoffset:0;}
  to  {stroke-dashoffset:-81.05;}
}
@keyframes glintCore{
  from{stroke-dashoffset:-5.5;}
  to  {stroke-dashoffset:-86.55;}
}
.uspico .glint-halo{animation:glintHalo 6.4s linear infinite;}
.uspico .glint-core{animation:glintCore 6.4s linear infinite;}

@media (prefers-reduced-motion:reduce){
  .uspico *{animation:none !important;}
}

/* ---- harness only, not part of the component ---- */
body{margin:0;padding:40px;background:#14110F;
  display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;}
.uspico{width:48px;height:48px;flex:none;}
</style>
